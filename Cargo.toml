[package]
name = "attendance"
version = "0.1.0"
edition = "2024"

[dependencies]
bon = "3.8.1"
clap = { version = "4.5.50", features = ["derive"] }
clap_complete = "4.5.66"
clap_usage = "2.0.3"
comfy-table = "7.2.1"
itertools = "0.14.0"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
